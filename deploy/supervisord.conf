[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D %(ENV_PGDATA)s -c config_file=%(ENV_PGDATA)s/postgresql.conf -k /tmp
user=postgres
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
user=root
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama]
command=/bin/ollama serve
environment=OLLAMA_HOST="127.0.0.1:%(ENV_OLLAMA_PORT)s",OLLAMA_MODELS="%(ENV_OLLAMA_MODELS)s"
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:brainapi-api]
command=/app/.venv/bin/python scripts/start_with_ollama.py /app/.venv/bin/python -m uvicorn src.services.api.app:app --host 0.0.0.0 --port 7860
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:brainapi-mcp]
command=/app/.venv/bin/python scripts/start_with_ollama.py /app/.venv/bin/python -m uvicorn src.services.mcp.app:app --host 127.0.0.1 --port 8001
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:brainapi-worker]
command=/app/.venv/bin/python scripts/start_with_ollama.py /app/.venv/bin/python -m celery -A src.workers.app:ingestion_app worker --loglevel=info --pool=threads --concurrency=2
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
